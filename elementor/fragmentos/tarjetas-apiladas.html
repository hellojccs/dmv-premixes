<!-- DMV Premixes — Tarjetas apiladas (referencia: Rezon Bio "Capabilities")
     Clases:
       dmv-stack          → contenedor que agrupa las tarjetas
       dmv-stack-card     → cada tarjeta (se queda fija arriba; la siguiente la cubre al hacer scroll)
       dmv-dark           → (opcional) tarjeta oscura: el indicador se pinta en White Sand
       dmv-stack-content  → contenedor del texto de la tarjeta (ahí se agrega el indicador automáticamente)
       dmv-shape          → imagen recortada con la forma del símbolo DMV
     Uso en Elementor: Elementor → Código personalizado → pegar todo → Ubicación: Fin del <body>. -->

<script>
(function(){
  if (window.__dmvStack) return; window.__dmvStack = true;
  function init(){
    var groups=[].slice.call(document.querySelectorAll('.dmv-stack'));
    if(!groups.length) return;
    var reduce=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var sets=groups.map(function(g){
      var cards=[].slice.call(g.querySelectorAll('.dmv-stack-card')).filter(function(c){return c.closest('.dmv-stack')===g;});
      cards.forEach(function(card,i){
        var slot=card.querySelector('.dmv-stack-content')||card;
        if(slot.querySelector('.dmv-stack-dots')) return;
        var d=document.createElement('div'); d.className='dmv-stack-dots'; d.setAttribute('aria-hidden','true');
        for(var k=0;k<cards.length;k++){ var s=document.createElement('span'); if(k===i) s.className='on'; d.appendChild(s); }
        slot.appendChild(d);
      });
      return cards;
    });
    if(reduce) return;
    var ticking=false;
    function update(){
      ticking=false;
      var desktop=window.innerWidth>=768;
      sets.forEach(function(cards){
        cards.forEach(function(card,i){
          var next=cards[i+1];
          if(!desktop||!next){ card.style.transform=''; card.style.filter=''; return; }
          var top=parseFloat(getComputedStyle(card).top)||0, h=card.offsetHeight;
          // 0 cuando la siguiente tarjeta aún está debajo · 1 cuando ya la cubrió por completo
          var p=Math.min(1,Math.max(0,(top+h-next.getBoundingClientRect().top)/h));
          card.style.transform=p?'scale('+(1-0.06*p).toFixed(4)+')':'';
          card.style.filter=p?'blur('+(p*3).toFixed(2)+'px)':'';
        });
      });
    }
    function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(update); } }
    window.addEventListener('scroll',onScroll,{passive:true});
    window.addEventListener('resize',onScroll);
    update();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
