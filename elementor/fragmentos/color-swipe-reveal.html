<!-- DMV Premixes — Color Swipe Reveal
     Las palabras de cualquier elemento con la clase "dmv-reveal" pasan, al hacer scroll,
     de un tono azul translúcido y desenfocado a su color final (referencia: Butter).
     Uso en Elementor: Elementor → Código personalizado → pegar todo → Ubicación: Fin del <body>.
     Luego, en el widget de texto: Avanzado → Clases CSS → dmv-reveal -->
<style>
.dmv-reveal .dmv-w{transition:color .6s ease,filter .6s ease,opacity .6s ease;}
.dmv-reveal .dmv-w:not(.on){color:var(--dmv-tint) !important;filter:blur(3px);opacity:.8;}
</style>
<script>
(function(){
  if (window.__dmvReveal) return; window.__dmvReveal = true;
  // Tonos de la paleta para las palabras aún no reveladas: Royal Blue → Cool Swell
  var A=[25,93,228,.55], B=[135,152,178,.75];
  function tint(t){ var c=A.map(function(v,i){return i<3?Math.round(v+(B[i]-v)*t):(v+(B[i]-v)*t).toFixed(2)}); return 'rgba('+c.join(',')+')'; }

  function split(root){
    var words=[], walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes=[], n;
    while((n=walker.nextNode())) if(n.nodeValue.trim()) nodes.push(n);
    nodes.forEach(function(node){
      var frag=document.createDocumentFragment();
      node.nodeValue.split(/(\s+)/).forEach(function(part){
        if(!part) return;
        if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); return; }
        var s=document.createElement('span'); s.className='dmv-w'; s.textContent=part;
        frag.appendChild(s); words.push(s);
      });
      node.parentNode.replaceChild(frag, node);
    });
    words.forEach(function(w,i){ w.style.setProperty('--dmv-tint', tint(words.length>1 ? i/(words.length-1) : 0)); });
    return words;
  }

  function init(){
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var items=[].slice.call(document.querySelectorAll('.dmv-reveal')).map(function(el){ return {el:el, words:split(el)}; });
    if(!items.length) return;
    var ticking=false;
    function update(){
      ticking=false;
      var vh=window.innerHeight;
      items.forEach(function(it){
        var r=it.el.getBoundingClientRect();
        // 0 cuando el texto entra por abajo (85% de la pantalla) · 1 cuando su parte superior llega al 35%
        var p=Math.min(1, Math.max(0, (vh*0.85 - r.top) / (vh*0.5)));
        var shown=p*it.words.length;
        it.words.forEach(function(w,i){ w.classList.toggle('on', i < shown); });
      });
    }
    function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(update); } }
    window.addEventListener('scroll', onScroll, {passive:true});
    window.addEventListener('resize', onScroll);
    update();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
